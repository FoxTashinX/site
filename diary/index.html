<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник | FoxTashinX</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* Calendar Specific Styles */
        #calendar {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
            max-height: 600px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 10px;
        }
        @media (min-width: 768px) {
            #calendar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            #calendar {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        /* Scrollbar styling for calendar */
        #calendar::-webkit-scrollbar {
            width: 8px;
        }
        #calendar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #calendar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        #calendar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .month {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .month h2 {
            text-align: center;
            margin: 0 0 1rem 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            text-transform: capitalize;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }

        .day:hover:not(.disabled) {
            background: #38bdf8;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transform: scale(1.1);
        }

        .day.disabled {
            background: transparent;
            cursor: default;
        }

        .hidden {
            display: none;
        }
        
        .day-info-panel {
            background: rgba(15, 32, 39, 0.8);
            border-left: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="antialiased">
    <!-- Particles background container -->
    <div id="particles-js"></div>

    <header class="glass-panel mx-4 mt-6 p-4 sticky top-6 z-50">
        <nav class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-xl font-bold tracking-wider gradient-text">
                FoxTashinX
            </div>
            <ul class="flex flex-wrap justify-center gap-6 text-sm font-medium">
                <li><a href="../index.html" class="nav-link"><i class="fa-solid fa-house mr-1"></i> Главная</a></li>
                <li><a href="../work/index.html" class="nav-link"><i class="fa-solid fa-briefcase mr-1"></i> Работы</a></li>
                <li><a href="index.html" class="nav-link active"><i class="fa-solid fa-book mr-1"></i> Дневник</a></li>
                <li><a href="../depressive-corner/index.html" class="nav-link"><i class="fa-solid fa-cloud-moon mr-1"></i> Уголок</a></li>
                <li><a href="../autor/index.html" class="nav-link"><i class="fa-solid fa-user mr-1"></i> Автор</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-16 flex-grow flex flex-col lg:flex-row gap-8">
        
        <div class="flex-grow">
            <div class="glass-panel p-8 w-full mb-8 text-center lg:text-left">
                <h1 class="text-4xl font-extrabold mb-2">Мой <span class="gradient-text">Дневник</span></h1>
                <p class="text-gray-300">Выберите дату в календаре, чтобы посмотреть записи.</p>
            </div>
            
            <div class="glass-panel p-6">
                <div id="calendar"></div>
            </div>
        </div>

        <div class="w-full lg:w-1/3 min-w-[300px]">
            <div id="day-info" class="glass-panel p-8 h-full hidden sticky top-32 flex flex-col">
                <h3 class="text-2xl font-bold mb-4 gradient-text"><i class="fa-regular fa-calendar-check mr-2"></i> Запись</h3>
                <p id="selected-date" class="text-gray-300 font-medium mb-6 pb-4 border-b border-white/10"></p>
                <div class="flex-grow text-gray-400 italic">
                    Записей за этот день нет.
                </div>
            </div>
            
             <div id="day-info-placeholder" class="glass-panel p-8 h-full flex flex-col items-center justify-center text-center text-gray-500 min-h-[300px] sticky top-32">
                <div class="text-5xl mb-4 opacity-50"><i class="fa-regular fa-calendar"></i></div>
                <p>Выберите день для просмотра записей</p>
            </div>
        </div>

    </main>

    <footer class="mt-auto py-8 text-center text-gray-400 text-sm glass-panel border-0 border-t border-white/10 rounded-none">
        <div class="flex justify-center gap-6 mb-4 text-xl">
            <a href="https://github.com/FoxTashinX" class="hover:text-white transition-colors"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.youtube.com/@foxytashin1036" class="hover:text-red-500 transition-colors"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.twitch.tv/foxtashin" class="hover:text-purple-500 transition-colors"><i class="fa-brands fa-twitch"></i></a>
        </div>
        <p>© 2024 FoxTashinX. Все права защищены.</p>
    </footer>

    <!-- Particles.js Script -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } }, "push": { "particles_nb": 2 } }
            },
            "retina_detect": true
        });

        // Calendar Logic
        document.addEventListener('DOMContentLoaded', () => {
            const calendarElement = document.getElementById('calendar');
            const dayInfoElement = document.getElementById('day-info');
            const dayInfoPlaceholder = document.getElementById('day-info-placeholder');
            const selectedDateElement = document.getElementById('selected-date');
    
            function generateMonth(year, month) {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay(); // 0 is Sunday
                
                // Adjust for Monday as first day of week
                let adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
    
                const monthElement = document.createElement('div');
                monthElement.classList.add('month');
    
                const monthName = new Date(year, month).toLocaleString('ru-RU', { month: 'long' });
                const monthTitle = document.createElement('h2');
                monthTitle.textContent = `${monthName} ${year}`;
                monthElement.appendChild(monthTitle);
    
                const daysContainer = document.createElement('div');
                daysContainer.classList.add('days');
                
                // Add day headers (Пн, Вт...)
                const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                dayNames.forEach(name => {
                    const el = document.createElement('div');
                    el.className = 'text-center text-xs font-bold text-gray-500 mb-1';
                    el.textContent = name;
                    daysContainer.appendChild(el);
                });
    
                for (let i = 0; i < adjustedFirstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.classList.add('day', 'disabled');
                    daysContainer.appendChild(emptyCell);
                }
    
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('day');
                    dayElement.textContent = day;
                    dayElement.addEventListener('click', () => showDayInfo(day, monthName, year));
                    daysContainer.appendChild(dayElement);
                }
    
                monthElement.appendChild(daysContainer);
                return monthElement;
            }
    
            function showDayInfo(day, monthName, year) {
                selectedDateElement.textContent = `${day} ${monthName} ${year}`;
                dayInfoPlaceholder.classList.add('hidden');
                dayInfoElement.classList.remove('hidden');
            }
    
            const currentYear = new Date().getFullYear();
            for (let month = 0; month < 12; month++) {
                calendarElement.appendChild(generateMonth(currentYear, month));
            }
        });
    </script>
</body>
</html>
