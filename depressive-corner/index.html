<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Галерея видео из моего портфолио.">
    <meta name="keywords" content="видео, портфолио, проекты">
    <meta name="author" content="FoxTashinX">
    <title>Уголок | FoxTashinX</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased">
    <!-- Particles background container -->
    <div id="particles-js"></div>

    <header class="glass-panel mx-4 mt-6 p-4 sticky top-6 z-50">
        <nav class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-xl font-bold tracking-wider gradient-text">
                FoxTashinX
            </div>
            <ul class="flex flex-wrap justify-center gap-6 text-sm font-medium">
                <li><a href="../index.html" class="nav-link"><i class="fa-solid fa-house mr-1"></i> Главная</a></li>
                <li><a href="../work/index.html" class="nav-link"><i class="fa-solid fa-briefcase mr-1"></i> Работы</a></li>
                <li><a href="../diary/index.html" class="nav-link"><i class="fa-solid fa-book mr-1"></i> Дневник</a></li>
                <li><a href="index.html" class="nav-link active"><i class="fa-solid fa-cloud-moon mr-1"></i> Уголок</a></li>
                <!-- Author link will be removed in next step, along with others -->
            <li><a href="#" onclick="event.preventDefault(); openAuthModal();" class="nav-link text-sky-400"><i class="fa-solid fa-right-to-bracket mr-1"></i> Войти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel p-8 max-w-md w-full relative transform scale-95 transition-transform duration-300" id="auth-modal-content">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold gradient-text mb-2">Авторизация</h2>
                <p class="text-gray-400 text-sm">Войдите или зарегистрируйтесь</p>
            </div>

            <!-- Tabs -->
            <div class="flex mb-6 border-b border-white/10">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-semibold border-b-2 border-sky-400 text-white transition-colors">Вход</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-white transition-colors">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="flex flex-col gap-4" onsubmit="event.preventDefault(); alert('Функция входа пока в разработке. Требуется настройка backend-сервера.');">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Email</label>
                    <input type="email" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Пароль</label>
                    <input type="password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-sky-500/30 mt-2">
                    Войти
                </button>
            </form>

            <!-- Register Form -->
            <form id="form-register" class="flex flex-col gap-4 hidden" onsubmit="event.preventDefault(); alert('Функция регистрации пока в разработке. Требуется настройка backend-сервера.');">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Имя</label>
                    <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="Ваше имя">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Email</label>
                    <input type="email" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Пароль</label>
                    <input type="password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="Создайте пароль">
                </div>
                <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-500/30 mt-2">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>


    <main class="container mx-auto px-4 py-16 flex-grow flex flex-col items-center">
        <!-- Empty Content -->
    </main>

    <footer class="mt-auto py-8 text-center text-gray-400 text-sm glass-panel border-0 border-t border-white/10 rounded-none">
        <div class="flex justify-center gap-6 mb-4 text-xl">
            <a href="https://github.com/FoxTashinX" class="hover:text-white transition-colors"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.youtube.com/@foxytashin1036" class="hover:text-red-500 transition-colors"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.twitch.tv/foxtashin" class="hover:text-purple-500 transition-colors"><i class="fa-brands fa-twitch"></i></a>
        </div>
        <p>© 2024 FoxTashinX. Все права защищены.</p>
    </footer>

    <!-- Particles.js Script -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } }, "push": { "particles_nb": 2 } }
            },
            "retina_detect": true
        });
    </script>

    <script>
        function openAuthModal() {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('auth-modal-content');
            modal.classList.remove('hidden');
            // trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeAuthModal() {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('auth-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.replace('border-transparent', 'border-sky-400');
                loginTab.classList.replace('text-gray-400', 'text-white');
                registerTab.classList.replace('border-sky-400', 'border-transparent');
                registerTab.classList.replace('text-white', 'text-gray-400');
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                registerTab.classList.replace('border-transparent', 'border-sky-400');
                registerTab.classList.replace('text-gray-400', 'text-white');
                loginTab.classList.replace('border-sky-400', 'border-transparent');
                loginTab.classList.replace('text-white', 'text-gray-400');
            }
        }
        
        // Close modal on outside click
        document.getElementById('auth-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAuthModal();
            }
        });
    </script>

</body>
</html>
