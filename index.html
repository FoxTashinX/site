<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Портфолио моих работ, личных записей и опыта.">
    <meta name="keywords" content="портфолио, работы, дневник, опыт, foxytashin">
    <meta name="author" content="FoxTashinX">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>FoxTashinX | Портфолио</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased">
    <!-- Particles background container -->
    <div id="particles-js"></div>

    <header class="glass-panel mx-4 mt-6 p-4 sticky top-6 z-50">
        <nav class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-xl font-bold tracking-wider gradient-text">
                FoxTashinX
            </div>
            <ul id="main-nav" class="flex flex-wrap justify-center gap-6 text-sm font-medium">
                <li><a href="index.html" class="nav-link active"><i class="fa-solid fa-house mr-1"></i> Главная</a></li>
                <li><a href="#" onclick="event.preventDefault(); openAuthModal();" class="nav-link text-sky-400"><i class="fa-solid fa-right-to-bracket mr-1"></i> Войти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel p-8 max-w-md w-full relative transform scale-95 transition-transform duration-300" id="auth-modal-content">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold gradient-text mb-2">Вход для своих</h2>
                <p class="text-gray-400 text-sm">Доступ только по приглашениям</p>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="flex flex-col gap-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Имя пользователя (Логин)</label>
                    <input type="text" id="login-username" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="Логин">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Пароль</label>
                    <input type="password" id="login-password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="text-red-400 text-sm hidden">Неверный логин или пароль</div>
                <div id="login-success" class="text-green-400 text-sm hidden">Успешный вход!</div>
                
                <button type="submit" id="login-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-sky-500/30 mt-2 flex justify-center items-center">
                    Войти
                </button>
            </form>
        </div>
    </div>


    <main id="main-content" class="container mx-auto px-4 py-16 flex-grow flex flex-col items-center justify-center text-center">
        <!-- Content will be injected dynamically by script.js -->
    </main>

    <footer class="mt-auto py-8 text-center text-gray-400 text-sm glass-panel border-0 border-t border-white/10 rounded-none">
        <div class="flex justify-center gap-6 mb-4 text-xl">
            <a href="https://github.com/FoxTashinX" class="hover:text-white transition-colors"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.youtube.com/@foxytashin1036" class="hover:text-red-500 transition-colors"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.twitch.tv/foxtashin" class="hover:text-purple-500 transition-colors"><i class="fa-brands fa-twitch"></i></a>
        </div>
        <p>© 2024 FoxTashinX. Все права защищены.</p>
    </footer>

    <!-- Particles.js Script -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 40,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.3,
                    "random": true
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.5,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 0.5
                        }
                    },
                    "push": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });
    </script>

    <script>
        function openAuthModal() {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('auth-modal-content');
            modal.classList.remove('hidden');
            // trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeAuthModal() {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('auth-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');
            const successMsg = document.getElementById('login-success');
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Вход...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successMsg.classList.remove('hidden');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    setTimeout(() => {
                        closeAuthModal();
                        window.location.reload();
                    }, 1000);
                } else {
                    errorMsg.textContent = data.message || 'Ошибка входа';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка соединения с сервером';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Войти';
                btn.disabled = false;
            }
        }
        
        // Logic moved to script.js
    </script>
    <script src="script.js"></script>

</body>
</html><!-- Обновление дизайна -->
